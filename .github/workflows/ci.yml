name: Continuous Integration & Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check and production build
        run: npm run build
        env:
          VITE_BACKEND_API_URL: http://localhost:8000/api/v1

  backend-ci:
    name: Backend Tests & Clean Architecture Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          cd backend
          pytest -v
        env:
          GEMINI_API_KEY: ""
          JWT_SECRET_KEY: test_jwt_secret_key_minimum_32_bytes_long_portfolio_2026
          ADMIN_DEFAULT_PASSWORD: Ely@MatrixArch2026!#
          DATABASE_URL: sqlite:///:memory:

  docker-ci:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
