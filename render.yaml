services:
  - type: web
    name: elyy-portfolio-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elyy-portfolio-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ADMIN_DEFAULT_USERNAME
        value: elyyihz
      - key: ADMIN_DEFAULT_PASSWORD
        value: Ely@MatrixArch2026!#
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: STEAM_ID
        sync: false

databases:
  - name: elyy-portfolio-db
    plan: free
    region: ohio
    databaseName: portfolio_db
    user: portfolio_user
